<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Budget"><meta name="theme-color" content="#EEF2F1" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0C1312" media="(prefers-color-scheme: dark)"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Budget Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column — month strip, balance card, money-in rows, category tiles, day ledger; bottom nav + add button */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --sunk:#E4EAE8; --fg:#132120; --muted:#5D6B69; --line:#D8E0DE;
  --accent:#0A6B63; --accent-fg:#FFFFFF; --accent-soft:#D3ECE8;
  --perm:#2F6FB0; --once:#C2412D; --want:#4E8A22; --inv:#6B4FB3; --debt:#B9700E; --good:#1E7A42;
  --shadow:0 1px 2px rgba(10,40,36,.06),0 6px 20px rgba(10,40,36,.06);
  --font:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1312; --surface:#152120; --sunk:#1C2B29; --fg:#E6EEEC; --muted:#93A4A1; --line:#24332F;
  --accent:#4FC3B3; --accent-fg:#06201C; --accent-soft:#123430;
  --perm:#7FB2EA; --once:#F28C74; --want:#A6D46E; --inv:#AD9BF2; --debt:#F0B35A; --good:#62D08E; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1312; --surface:#152120; --sunk:#1C2B29; --fg:#E6EEEC; --muted:#93A4A1; --line:#24332F;
  --accent:#4FC3B3; --accent-fg:#06201C; --accent-soft:#123430;
  --perm:#7FB2EA; --once:#F28C74; --want:#A6D46E; --inv:#AD9BF2; --debt:#F0B35A; --good:#62D08E; --shadow:none; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 120px;display:flex;flex-direction:column;gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em}
.store{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.brand-wrap{display:flex;flex-direction:column;gap:2px;min-width:0}
.langsw{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;flex:none}
.langsw button{border:0;background:transparent;border-radius:8px;padding:6px 9px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.langsw button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:7px}
.presets button{border:1px solid var(--line);background:transparent;border-radius:12px;padding:9px 10px;font-size:13px;text-align:left;display:flex;align-items:center;gap:8px;min-width:0}
.presets button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.presets button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
.presets button i{flex:none;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.45}
.presets button.hist i{opacity:0;width:0;margin-right:-8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)}
.scroller{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:2px}
.scroller::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.add{border-style:dashed;color:var(--accent);background:transparent}
.mchip{flex:none;border:0;background:transparent;padding:8px 10px;border-radius:10px;color:var(--muted);font-weight:500;position:relative}
.mchip.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.mchip.has::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor;opacity:.6}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.hero{padding:18px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1;overflow-wrap:anywhere}
.big small{font-size:16px;font-weight:500;color:var(--muted);margin-left:4px}
.big.neg{color:var(--once)}
.meter{height:8px;border-radius:6px;background:var(--sunk);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.split{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.split b{color:var(--fg);font-weight:600;display:block;font-size:15px}
.split>span:last-child{text-align:right}
.list .item{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;border:0;background:transparent;text-align:left}
.list .item+.item{border-top:1px solid var(--line)}
.list .item .grow{flex:1;min-width:0}
.list .item .grow span{display:block;font-size:12px;color:var(--muted)}
.list .item .val{font-weight:600;white-space:nowrap}
.tag{flex:none;width:10px;height:10px;border-radius:3px}
.pen{flex:none;width:16px;height:16px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow)}
.tile span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tile b{font-size:clamp(13px,3.7vw,16px);font-weight:600;overflow-wrap:anywhere;line-height:1.25}
.tile em{font-style:normal;font-size:12px;color:var(--muted)}
.c-perm{color:var(--perm)} .c-once{color:var(--once)} .c-want{color:var(--want)} .c-inv{color:var(--inv)} .c-debt{color:var(--debt)}
.b-perm{background:var(--perm)} .b-once{background:var(--once)} .b-want{background:var(--want)} .b-inv{background:var(--inv)} .b-debt{background:var(--debt)} .b-rest{background:var(--line)}
.day{display:flex;flex-direction:column;gap:6px}
.day-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--muted);padding-inline:4px;font-weight:500}
.day-h .r{display:flex;gap:10px}
.day-h .r b{color:var(--fg);font-weight:600}
.day-h.we>span:first-child{color:var(--debt)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;border:0;background:transparent;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.ic{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:12px;font-weight:700}
.ic.perm{background:color-mix(in srgb,var(--perm) 15%,transparent);color:var(--perm)}
.ic.once{background:color-mix(in srgb,var(--once) 15%,transparent);color:var(--once)}
.ic.want{background:color-mix(in srgb,var(--want) 15%,transparent);color:var(--want)}
.row-main{flex:1;min-width:0}
.row-main b{display:block;font-weight:500;overflow-wrap:anywhere}
.row-main span{display:block;font-size:12px;color:var(--muted)}
.amt{font-weight:600;white-space:nowrap}
.empty{padding:26px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--fg);font-weight:600}
.sec{padding:16px;display:flex;flex-direction:column;gap:12px}
.sec h3{margin:0;font-size:15px;font-weight:600}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.srow{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:6px 10px;font-size:14px}
.srow .pct{color:var(--muted);font-size:13px;min-width:46px;text-align:right}
.hint{font-size:12px;color:var(--muted);margin:0}
.callout{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:14px}
.callout b{font-weight:600}
.ytable{width:100%;border-collapse:collapse;font-size:13px}
.ytable th{font-weight:500;color:var(--muted);text-align:right;padding:6px 6px;white-space:nowrap}
.ytable th:first-child,.ytable td:first-child{text-align:left}
.ytable td{text-align:right;padding:8px 6px;border-top:1px solid var(--line);white-space:nowrap}
.ytable tr.tot td{font-weight:600;border-top:2px solid var(--line)}
.tw{overflow-x:auto;margin-inline:-4px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:600;background:var(--accent);color:var(--accent-fg);width:100%}
.btn.ghost{background:var(--sunk);color:var(--fg)}
.btn.danger{background:transparent;color:var(--once);border:1px solid color-mix(in srgb,var(--once) 40%,transparent)}
.btn.danger.arm{background:var(--once);color:var(--surface)}
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.flabel{font-size:13px;color:var(--muted);font-weight:500}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 4px;font-weight:500;color:var(--muted);font-size:14px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.seg.cat button.on[data-v="perm"]{color:var(--perm)}
.seg.cat button.on[data-v="once"]{color:var(--once)}
.seg.cat button.on[data-v="want"]{color:var(--want)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px}
.inp:focus{outline:none;border-color:var(--accent)}
.amtline{display:flex;align-items:flex-end;gap:10px}
.bigin{flex:1;min-width:0;font-size:30px;font-weight:700;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:6px 2px;background:transparent;width:100%}
.bigin:focus{outline:none;border-color:var(--accent)}
.sign{flex:none;border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 10px;font-size:13px;color:var(--muted)}
.sign.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 11px;font-size:13px}
.months{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.months button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 2px;font-size:13px}
.months button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addline{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.addline .inp[type=date]{width:auto;padding:10px}
.addline.small{margin-top:4px}
.addline.small .inp{padding:10px 12px;font-size:15px}
.nudge{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r);background:color-mix(in srgb,var(--debt) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--debt) 35%,transparent)}
.nudge .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nudge b{font-weight:600}
.nudge span{font-size:13px;color:var(--muted)}
.nudge .btn{width:auto;flex:none;padding:10px 16px}
.remgrid{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:6px 14px;border-radius:12px;background:var(--sunk)}
.remgrid label{font-size:15px}
.remgrid .inp{width:auto;min-width:120px;padding:8px 12px;font-size:18px;font-weight:600;text-align:center}
.hint.warn{color:var(--once)}
.hint.okline{color:var(--good);font-weight:500}
.totrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:var(--sunk);border-radius:12px;padding:12px 14px}
.totrow b{font-size:20px;font-weight:700}
.xbtn{flex:none;border:0;background:var(--sunk);border-radius:8px;min-width:32px;height:32px;padding:0 8px;color:var(--muted);font-size:16px}
.xbtn.arm{background:var(--once);color:var(--surface);font-size:12px;font-weight:600}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;background:var(--sunk)}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr;align-items:center;padding-inline:8px}
.nav button.tab{border:0;background:transparent;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-weight:500}
.nav button.tab.on{color:var(--accent)}
.nav svg{width:22px;height:22px}
.fab{justify-self:center;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;margin-top:-22px;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent)}
.fab svg{width:26px;height:26px}
.scrim{position:fixed;inset:0;background:rgba(5,15,14,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;justify-content:center}
.sheet.open{transform:none}
.sheet-in{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow-y:auto}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);align-self:center}
.sheet h2{margin:0;font-size:18px;font-weight:600}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%) translateY(-20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;z-index:20;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<div class="app" id="app">
  <div class="top">
    <div class="brand-wrap"><div class="brand">Budget Tracker</div><div class="store"><span class="dot" id="dot"></span><span id="storeTxt"></span></div></div>
    <div class="langsw" id="langsw" role="group" aria-label="Language"></div>
  </div>
  <div class="scroller" id="years"></div>
  <div id="view"></div>
</div>

<nav class="nav"><div class="nav-in">
  <button class="tab on" data-tab="month" id="tabMonth"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span></span></button>
  <button class="tab" data-tab="year" id="tabYear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V11M10 20V5M15 20v-7M20 20V8"/></svg><span></span></button>
  <button class="fab" id="fab" aria-label="+"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tab" data-tab="settings" id="tabSet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span></span></button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="sheet-in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>

<script>

function cfg(y){if(!meta.cfg[y])meta.cfg[y]={startMonth:0,startSav:0};return meta.cfg[y]}
function blankMonth(){return {salary:0,invest:0,debt:0,parts:{salary:[],invest:[],debt:[]},entries:[]}}
function mon(y,m){return data[mkey(y,m)]||blankMonth()}
function monW(y,m){const k=mkey(y,m);if(!data[k])data[k]=blankMonth();return data[k]}
function fixParts(o,key){ // every received part is kept; the month total is their sum
  o.parts=o.parts||{};
  for(const f of ["salary","invest","debt"]){
    let L=Array.isArray(o.parts[f])?o.parts[f].filter(p=>p&&isFinite(Number(p.amount))).map(p=>({id:p.id||uid(),amount:Number(p.amount),date:p.date||key+"-01"})):[];
    if(!L.length&&Number(o[f]))L=[{id:uid(),amount:Number(o[f]),date:key+"-01"}];
    o.parts[f]=L;o[f]=r2(L.reduce((a,p)=>a+p.amount,0));
  }
  return o;
}

/* ================= migration (v1 → v2) ================= */
function normalize(m0,d0){
  const m={years:(m0&&m0.years&&m0.years.length?m0.years.map(Number):[CY]),lang:(m0&&m0.lang)||"ru",cur:(m0&&m0.cur)||"UZS",cfg:{}};
  const r0=(m0&&m0.reminder)||{};
  m.reminder={on:!!r0.on,time:/^\d{2}:\d{2}$/.test(r0.time||"")?r0.time:"21:00",skip:r0.skip!==false};
  const src=(m0&&m0.cfg)||{};
  for(const y of m.years){const c=src[y]||{};m.cfg[y]={startMonth:Number(c.startMonth)||0,startSav:Number(c.startSav)||0}}
  if(m0&&m0.start)for(const y in m0.start){if(!m.cfg[y])m.cfg[y]={startMonth:0,startSav:0};m.cfg[y].startSav=Number(m0.start[y])||0}
  const d={};
  for(const k in (d0||{})){
    const v=d0[k];
    if(Array.isArray(v)){ // v1 month: list of {type,cat,amount,date,note}
      const o={salary:0,invest:0,debt:0,entries:[]};
      for(const e of v){
        if(e.type==="inc")o.salary+=Number(e.amount)||0;
        else if(e.type==="inv")o.invest+=Number(e.amount)||0;
        else o.entries.push({id:e.id||uid(),date:e.date,cat:"once",what:e.note||e.cat||"",amount:Number(e.amount)||0,ts:e.ts||0});
      }
      d[k]=o;
    }else if(v&&typeof v==="object"){
      d[k]={salary:Number(v.salary)||0,invest:Number(v.invest)||0,debt:Number(v.debt)||0,parts:v.parts,
        entries:(Array.isArray(v.entries)?v.entries:[]).filter(e=>e&&e.date).map(e=>({id:e.id||uid(),date:e.date,cat:CATS.includes(e.cat)?e.cat:"once",what:String(e.what||""),amount:Number(e.amount)||0,ts:e.ts||0}))};
    }
  }
  for(const k in d)fixParts(d[k],k);
  for(const k in d){const y=Number(k.slice(0,4));if(!m.years.includes(y)){m.years.push(y);m.cfg[y]={startMonth:0,startSav:0}}}
  return {meta:m,data:d};
}

/* ================= money math (mirrors the spreadsheet) ================= */
function catSums(list){const s={perm:0,once:0,want:0};for(const e of list||[])s[e.cat]+=Number(e.amount)||0;return s}
function yearCalc(y){
  const c=cfg(y),out={};let carry=Number(c.startSav)||0;
  for(let m=c.startMonth;m<12;m++){
    const mo=mon(y,m),s=catSums(mo.entries);
    const avail=mo.salary-mo.invest+carry+mo.debt;
    const spent=s.perm+s.once+s.want;
    const end=avail-spent;
    out[m]={m,carry,salary:mo.salary,invest:mo.invest,debt:mo.debt,...s,spent,avail,end};
    carry=end;
  }
  return out;
}

/* ================= persistence ================= */
function cacheWrite(){try{localStorage.setItem(LS,JSON.stringify({meta,data}))}catch(e){}}
function cacheRead(){
  try{let raw=localStorage.getItem(LS)||localStorage.getItem(LS1);if(!raw)return false;
    const o=JSON.parse(raw);if(!o||!o.meta)return false;const n=normalize(o.meta,o.data);meta=n.meta;data=n.data;return true}catch(e){return false}
}
const queues={};
function enqueue(key,fn){const p=(queues[key]||Promise.resolve()).then(fn).catch(err=>{console.error(err);toast(t("saveFail"))});queues[key]=p;return p}
function saveMeta(){cacheWrite();if(mode==="db")enqueue("meta",()=>dbCol.doc("meta").set({v:2,years:meta.years,lang:meta.lang,cur:meta.cur,cfg:meta.cfg,reminder:meta.reminder}))}
function saveMonth(key){
  cacheWrite();if(mode!=="db")return;
  const o=data[key];const ref=dbCol.doc("m-"+key);const [y,m]=key.split("-").map(Number);
  const empty=!o||(!o.salary&&!o.invest&&!o.debt&&!(o.entries||[]).length);
  enqueue("m-"+key,()=>empty?ref.delete():ref.set({year:y,month:m,salary:o.salary,invest:o.invest,debt:o.debt,parts:o.parts,entries:o.entries}));
}
async function connect(){
  if(window.Android||!window.claude||!window.claude.use)return;
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    dbCol=db.collection("data/users/"+id);
    const snap=await dbCol.get();
    if(snap.empty){mode="db";saveMeta();for(const k of Object.keys(data))saveMonth(k)}
    else{
      const nd={};let nm=null;
      for(const d of snap.docs){const v=d.data();if(d.id==="meta")nm=v;else if(d.id.startsWith("m-"))nd[d.id.slice(2)]=v.entries&&!("salary" in v)&&v.entries.length&&v.entries[0].type?v.entries:v}
      const n=normalize(nm||meta,nd);meta=n.meta;data=n.data;mode="db";cacheWrite();
      if(nm&&nm.v!==2){saveMeta();for(const k of Object.keys(data))saveMonth(k)}
      fixSel();
    }
    render();
  }catch(e){console.error(e);mode="local";render()}
}
function fixSel(){
  if(!meta.years.includes(sel.year))sel.year=meta.years.slice().sort((a,b)=>b-a)[0];

function todayHas(){const d=new Date(),k=mkey(d.getFullYear(),d.getMonth()),td=iso(d);return ((data[k]||{}).entries||[]).some(e=>e.date===td)}
function syncLogged(){if(!HAS_NATIVE)return;try{window.Android.markLogged(todayHas()?todayISO():"")}catch(e){}}

const PEN=`<svg class="pen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>`;
function pctOf(a,b){return b?Math.round(a/b*1000)/10+"%":"—"}
function structRows(c){
  const base=c.salary;const rest=c.end;
  const parts=[["perm",c.perm],["once",c.once],["want",c.want],["inv",c.invest],["rest",rest]];
  const tot=parts.reduce((a,[,v])=>a+Math.max(v,0),0)||1;
  const bar=parts.map(([k,v])=>v>0?`<i class="b-${k}" style="width:${(v/tot*100).toFixed(2)}%"></i>`:"").join("");
  const names={perm:t("perm"),once:t("once"),want:t("want"),inv:t("invShort"),rest:t("restShort")};
  const rows=parts.map(([k,v])=>`<div class="srow"><span class="tag b-${k}"></span><span>${esc(names[k])}</span><span class="num">${fmt(v)}</span><span class="pct num">${pctOf(v,base)}</span></div>`).join("");
  return {bar,rows};
}
function analysis(c){
  if(!c.spent)return `<p class="hint">${esc(t("noSpend"))}</p>`;
  const r=CATS.map(k=>[k,c[k]]).sort((a,b)=>b[1]-a[1]);
  const top=r[0];
  return r.map(([k,v],i)=>`<div class="srow"><span class="tag b-${k}"></span><span>${i+1}. ${esc(t(k))}</span><span class="num">${fmt(v)}</span><span class="pct num">${pctOf(v,c.spent)}</span></div>`).join("")+

}
function renderMonth(){
  const y=sel.year,c0=cfg(y);if(sel.month<c0.startMonth)sel.month=c0.startMonth;

let draft=null,armed=false;

function defaultDate(){const d=todayISO();return d.startsWith(mkey(sel.year,sel.month))?d:mkey(sel.year,sel.month)+"-01"}
function findEntry(id){for(const k in data)for(const e of data[k].entries||[])if(e.id===id)return {...e};return null}
function openEntry(id){
  if(id){const f=findEntry(id);if(!f)return;draft={...f,neg:f.amount<0,amount:Math.abs(f.amount)}}
  else draft={id:null,cat:"once",what:"",amount:"",date:defaultDate(),neg:false};
  armed=false;drawEntry();

}
function suggestions(cat){
  // your own frequent names first, then the ready-made options for this category
  const cnt={};for(const k in data)for(const e of data[k].entries||[])if(e.cat===cat&&e.what){const w=e.what.trim();cnt[w]=(cnt[w]||0)+1}
  const pre=(PRESETS[meta.lang]||PRESETS.ru)[cat];
  const hist=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).filter(w=>!pre.includes(w)).slice(0,6);
  return hist.map(w=>({w,h:1})).concat(pre.map(w=>({w,h:0})));
}
function drawEntry(){
  const d=draft;

function parseNum(s){s=String(s).replace(/[\s  ]/g,"").replace(",",".");const v=parseFloat(s);return isFinite(v)?v:""}
function readDraft(){if(!draft)return;const a=$("amtIn");if(a)draft.amount=parseNum(a.value);const w=$("whatIn");if(w)draft.what=w.value.trim();const dt=$("dateIn");if(dt&&dt.value)draft.date=dt.value}
function removeEntry(id){for(const k in data){const L=data[k].entries||[];const i=L.findIndex(e=>e.id===id);if(i>=0){L.splice(i,1);return k}}return null}
function ensureYear(y){if(!meta.years.includes(y)){meta.years.push(y);cfg(y);saveMeta()}}
function saveEntry(){
  readDraft();const d=draft;
  if(!(d.amount>0)){toast(t("enterAmount"));const a=$("amtIn");if(a)a.focus();return}
  const oldKey=d.id?removeEntry(d.id):null;
  const e={id:d.id||uid(),date:d.date,cat:d.cat,what:d.what||"",amount:r2(d.neg?-d.amount:d.amount),ts:d.ts||Date.now()};
  const y=Number(e.date.slice(0,4)),m=Number(e.date.slice(5,7))-1;ensureYear(y);
  if(m<cfg(y).startMonth){cfg(y).startMonth=m;saveMeta()}
  const k=mkey(y,m),list=monW(y,m).entries;
  const same=!d.id&&e.what&&e.amount>0?list.find(x=>x.date===e.date&&x.cat===e.cat&&x.amount>0&&x.what.trim().toLowerCase()===e.what.trim().toLowerCase()):null;
  let msg=t("saved");
  if(same){same.amount=r2(same.amount+e.amount);msg=t("added")+" «"+same.what+"»: "+fmt(same.amount)+" "+cur()}
  else list.push(e);
  if(oldKey&&oldKey!==k)saveMonth(oldKey);saveMonth(k);
  sel.year=y;sel.month=m;closeSheet();tab="month";render();toast(msg);
}

function createYear(){
  const y=parseInt($("yIn").value,10);if(!(y>1990&&y<2200))return;

  meta.years.push(y);meta.cfg[y]={startMonth:0,startSav:($("carryIn").checked&&prev)?r2(yearCalc(prev)[11].end):0};

/* --- zip (stored) --- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zip(files){
  const enc=new TextEncoder();const parts=[];const cd=[];let off=0;
  for(const f of files){
    const nm=enc.encode(f.name),d=typeof f.data==="string"?enc.encode(f.data):f.data,c=crc32(d);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);
    h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(h.buffer),nm,d);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(14,0x21,true);
    ch.setUint32(16,c,true);ch.setUint32(20,d.length,true);ch.setUint32(24,d.length,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer),nm);off+=30+nm.length+d.length;
  }
  const cdLen=cd.reduce((a,b)=>a+b.length,0);const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdLen,true);e.setUint32(16,off,true);
  const all=[...parts,...cd,new Uint8Array(e.buffer)];const out=new Uint8Array(all.reduce((a,b)=>a+b.length,0));let p=0;for(const a of all){out.set(a,p);p+=a.length}return out;
}

function colName(i){let s="";i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s}
function colIdx(s){let n=0;for(const ch of s)n=n*26+ch.charCodeAt(0)-64;return n-1}

function buildYearXlsx(y){
  const L=meta.lang,X=XL[L]||XL.ru,c0=cfg(y),calc=yearCalc(y),C=(CUR[meta.cur]||CUR.UZS);
  const curL=C[L],MN=MONTHS[L],ms=[];for(let m=c0.startMonth;m<12;m++)ms.push(m);
  const sub=(s,o)=>s.replace(/\{(\w)\}/g,(_,k)=>o[k]!==undefined?o[k]:"");
  const D=`01.${pad(c0.startMonth+1)}.${y}`;
  const q=n=>"'"+n.replace(/'/g,"''")+"'";
  const serial=(yy,mm,dd)=>(Date.UTC(yy,mm,dd)-Date.UTC(1899,11,30))/86400000;
  const kfmt=a=>{const ab=Math.abs(a);return ab>=1000&&ab%1000===0?(a/1000)+X.k:fmt(a)};
  const sheets=[];
  // Guide
  const g=Sheet(X.guide);g.cols=[105];
  X.guideLines.forEach((ln,i)=>{if(!ln[0])return;put(g,"A"+(i+1),sub(ln[0],{D,Y:y}),ln[1]==="T"?S.title:ln[1]==="B"?S.lbl:0)});
  g.heights[1]=27.75;sheets.push(g);
  // Summary + Savings (filled after month rows are known)
  const su=Sheet(X.sum),sv=Sheet(X.sav);sheets.push(su,sv);
  const mInfo={};
  // month sheets
  ms.forEach((m,idx)=>{
    const c=calc[m],mo=mon(y,m),n=dim(y,m),name=MN[m],sh=Sheet(name);
    const itog=10+2*n,ost=itog+6;mInfo[m]={name,itog,ost};
    sh.cols=[13,15,44.14,42.86,20,16,18,3,16,12,12];sh.freeze=[2,9];sh.heights[1]=27.75;sh.heights[9]=31.5;
    put(sh,"A1",sub(X.mTitle,{M:name,Y:y}),S.title);for(const k of "BCDEFG")put(sh,k+"1","",S.title);sh.merges.push("A1:G1");
    // several received parts are written as a sum, e.g. =2400000+2417594
    const pf=f=>{const L=((mo.parts||{})[f]||[]).map(p=>r2(p.amount));return L.length>1?L.join("+"):undefined};
    put(sh,"A3",X.salary,S.lbl);put(sh,"B3",c.salary,S.inBlue,pf("salary"));
    const prev=idx===0?null:mInfo[ms[idx-1]];
    put(sh,"A4",X.carry,S.lbl);put(sh,"B4",c.carry,S.money,prev?`${q(prev.name)}!B${prev.ost}`:`${q(X.sav)}!C4`);
    put(sh,"A5",X.invest,S.lbl);put(sh,"B5",c.invest,S.inBlue,pf("invest"));
    put(sh,"A6",X.debt,S.lbl);put(sh,"B6",c.debt,S.inOrange,pf("debt"));
    put(sh,"A7",X.avail,S.lbl);put(sh,"B7",c.avail,S.money,"B3-B5+B4+B6");
    [X.date,"",X.perm,X.once,X.want,X.dayTot,X.left].forEach((h,i)=>put(sh,colName(i)+"9",h,S.head));
    const byDay={};for(const e of mo.entries||[]){const d=+e.date.slice(8,10);((byDay[d]=byDay[d]||{})[e.cat]=byDay[d][e.cat]||[]).push(e)}
    let run=c.avail;
    for(let d=1;d<=n;d++){
      const r=10+2*(d-1),dt=new Date(y,m,d),we=dt.getDay()===0||dt.getDay()===6;
      put(sh,"A"+r,serial(y,m,d),we?S.dateWe:S.date);put(sh,"A"+(r+1),"",we?S.dateWe:S.date);sh.merges.push(`A${r}:A${r+1}`);
      put(sh,"B"+r,X.bought,we?S.smallWe:S.small);put(sh,"B"+(r+1),sub(X.sumLbl,{C:curL}),we?S.smallWe:S.small);
      let dayTot=0;
      ["perm","once","want"].forEach((k,j)=>{
        const L2=((byDay[d]||{})[k]||[]).slice().sort((a,b)=>(a.ts||0)-(b.ts||0));const col=colName(2+j);
        const sum=r2(L2.reduce((a,e)=>a+e.amount,0));dayTot+=sum;
        const txt=L2.length===1?(L2[0].what||""):L2.map(e=>`${e.what||"—"}(${kfmt(e.amount)})`).join("+");
        put(sh,col+r,txt,S.green);put(sh,col+(r+1),sum,S.inBlueDay);
      });
      run-=dayTot;

      put(sh,"G"+r,r2(run),we?S.moneyCWe:S.moneyC,d===1?`$B$7-F${r}`:`G${r-2}-F${r}`);put(sh,"G"+(r+1),"",we?S.moneyCWe:S.moneyC);sh.merges.push(`G${r}:G${r+1}`);
    }
    put(sh,"A"+itog,X.monthTot,S.totL);put(sh,"B"+itog,"",S.totL);
    put(sh,"C"+itog,c.perm,S.totM,`SUM(C10:C${itog-1})`);put(sh,"D"+itog,c.once,S.totM,`SUM(D10:D${itog-1})`);put(sh,"E"+itog,c.want,S.totM,`SUM(E10:E${itog-1})`);
    put(sh,"F"+itog,c.spent,S.totM,`SUM(F10:F${itog-1})`);put(sh,"G"+itog,c.end,S.totM,`G${itog-2}`);

      .forEach(([nm,v,ref],i)=>{const r=itog+2+i;put(sh,"I"+r,nm,S.stL);put(sh,"J"+r,pc(v),S.stP,`IFERROR(${ref}/$B$3,0)`)});
    // analysis block

    const cats=[[X.cPerm,c.perm,"C"],[X.cOnce,c.once,"D"],[X.cWant,c.want,"E"]];
    cats.forEach(([nm,v,col],i)=>{const r=an+2+i;put(sh,"I"+r,nm,S.txt);put(sh,"J"+r,v,S.money,`${col}${itog}`);put(sh,"K"+r,spent?v/spent:0,S.pct,`IFERROR(J${r}/$B$${a+3},0)`)});
    const rng=`$J$${an+2}:$J$${an+4}`,nrng=`$I$${an+2}:$I$${an+4}`;
    put(sh,"I"+(an+6),X.rank,S.lbl);
    const sorted=cats.slice().sort((p,q2)=>q2[1]-p[1]);
    sorted.forEach(([nm,v],i)=>{const r=an+7+i;
      put(sh,"J"+r,v,S.money,`IFERROR(LARGE(${rng},${i+1}),0)`);
      put(sh,"I"+r,nm,S.txt,`IFERROR(INDEX(${nrng},MATCH(J${r},${rng},0)),"")`);
      put(sh,"K"+r,spent?v/spent:0,S.pct,`IFERROR(J${r}/$B$${a+3},0)`)});
    const hr=an+10,tp=sorted[0];
    const hintV=spent?`${X.top}${tp[0]} — ${fmt(tp[1])} ${curL} (${(spent?tp[1]/spent*100:0).toFixed(1)}%${X.ofAll})`:X.noExp;
    put(sh,"I"+hr,hintV,S.hint,`IF($B$${a+3}=0,"${X.noExp}","${X.top}"&I${an+7}&" — "&TEXT(J${an+7},"#,##0")&" ${curL} ("&TEXT(K${an+7},"0.0%")&"${X.ofAll})")`);
    sh.merges.push(`I${hr}:K${hr+1}`);sh.heights[hr]=30;
    sh.charts.push({kind:"pie",col:7,colOff:180975,row:itog+7,rowOff:142875,cx:4114800,cy:3019425,p:{sheet:name,r1:itog+2,r2:itog+7,title:sub(X.pie,{M:name})}});
    sh.charts.push({kind:"anBar",col:8,row:an+11,rowOff:76200,cx:4114800,cy:2647950,p:{sheet:name,r1:an+2,r2:an+4,title:sub(X.bar,{M:name}),names:[X.amount],ay:curL}});
    sheets.push(sh);
  });
  // Summary sheet
  const k=ms.length,last=3+k,tr=4+k;
  su.cols=[14,16,16,18,16,16,14,16];su.heights[1]=27.75;su.heights[3]=31.5;
  put(su,"A1",sub(X.sTitle,{D}),S.title);for(const cc of "BCDEFGH")put(su,cc+"1","",S.title);su.merges.push("A1:H1");
  [X.sMonth,X.sSalary,X.cPerm,X.cOnce,X.cWant,X.cInv,X.cDebt,X.cRest].forEach((h,i)=>put(su,colName(i)+"3",h,S.head));
  const tot={salary:0,perm:0,once:0,want:0,invest:0,debt:0};
  ms.forEach((m,i)=>{const r=4+i,c=calc[m],I=mInfo[m],nn=q(I.name);
    for(const kk in tot)tot[kk]+=c[kk];
    put(su,"A"+r,I.name,S.txt);put(su,"B"+r,c.salary,S.money,`${nn}!B3`);put(su,"C"+r,c.perm,S.money,`${nn}!C${I.itog}`);
    put(su,"D"+r,c.once,S.money,`${nn}!D${I.itog}`);put(su,"E"+r,c.want,S.money,`${nn}!E${I.itog}`);put(su,"F"+r,c.invest,S.money,`${nn}!B5`);
    put(su,"G"+r,c.debt,S.money,`${nn}!B6`);put(su,"H"+r,c.end,S.money,`${nn}!B${I.ost}`)});
  put(su,"A"+tr,X.sTotal,S.totL);
  [["B","salary"],["C","perm"],["D","once"],["E","want"],["F","invest"],["G","debt"]].forEach(([cc,kk])=>put(su,cc+tr,tot[kk],S.totM,`SUM(${cc}4:${cc}${last})`));
  put(su,"H"+tr,calc[11].end,S.totM,`H${last}`);
  su.charts.push({kind:"sumBar",col:0,row:tr+1,cx:6829425,cy:3400425,p:{sheet:X.sum,r1:4,r2:last,title:X.ch1,names:[X.cPerm,X.cOnce,X.cWant,X.cInv,X.cDebt],ax:X.axM,ay:curL}});
  su.charts.push({kind:"sumLine",col:0,row:tr+21,cx:6829425,cy:3400425,p:{sheet:X.sum,r1:4,r2:last,title:X.ch2,names:[X.cRest],ay:curL}});
  // Savings sheet
  sv.cols=[14,18,18,20,12];sv.heights[1]=27.75;sv.heights[6]=31.5;
  put(sv,"A1",X.vTitle,S.title);for(const cc of "BCDE")put(sv,cc+"1","",S.title);sv.merges.push("A1:E1");
  put(sv,"A3",X.vStart,S.lbl);put(sv,"B3",Number(c0.startSav)||0,S.inBlue);
  put(sv,"A4",X.vNote,S.note);put(sv,"C4",Number(c0.startSav)||0,S.money,"B3");
  [X.sMonth,X.vRest,X.vEnd,X.vChg].forEach((h,i)=>put(sv,colName(i)+"6",h,S.head));
  ms.forEach((m,i)=>{const r=7+i,c=calc[m],I=mInfo[m],nn=q(I.name);
    put(sv,"A"+r,I.name,S.txt);put(sv,"B"+r,c.end-c.carry,S.money,`${nn}!B${I.ost}-${nn}!B4`);put(sv,"C"+r,c.end,S.money,`${nn}!B${I.ost}`);

    put(sv,"D"+r,base?(c.end-c.carry)/base:0,S.pct,i===0?`IFERROR(B${r}/$B$3,0)`:`IFERROR(B${r}/C${r-1},0)`)});
  sv.charts.push({kind:"savLine",col:0,row:8+k,cx:6134100,cy:3400425,p:{sheet:X.sav,r1:7,r2:6+k,title:X.vChart,names:[X.vEnd],ax:X.axM,ay:curL}});
  // package
  const files=[],ctO=[];let chartN=0,drawN=0;

    ctO.push(`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`);
    if(has){
      drawN++;const dn=drawN;
      files.push({name:`xl/worksheets/_rels/sheet${i+1}.xml.rels`,data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing${dn}.xml"/></Relationships>`});
      files.push({name:`xl/drawings/drawing${dn}.xml`,data:drawingXml(sh.charts)});
      ctO.push(`<Override PartName="/xl/drawings/drawing${dn}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>`);
      const rels=sh.charts.map((c,j)=>{chartN++;
        files.push({name:`xl/charts/chart${chartN}.xml`,data:chartXml(c.kind,c.p)});
        ctO.push(`<Override PartName="/xl/charts/chart${chartN}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawingml.chart+xml"/>`);
        return `<Relationship Id="rId${j+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/chart" Target="../charts/chart${chartN}.xml"/>`}).join("");
      files.push({name:`xl/drawings/_rels/drawing${dn}.xml.rels`,data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels}</Relationships>`});
    }

  const wb=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView activeTab="${Math.min(sheets.length-1,3+Math.max(0,(y===CY?now.getMonth():c0.startMonth)-c0.startMonth))}"/></bookViews><sheets>`+
    sheets.map((s,i)=>`<sheet name="${xe(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")+`</sheets><calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>`;
  const wbr=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`+
    sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")+

/* ================= files ================= */
function b64(u8){let s="";const C=0x8000;for(let i=0;i<u8.length;i+=C)s+=String.fromCharCode.apply(null,u8.subarray(i,i+C));return btoa(s)}
async function saveBytes(name,u8,mime){
  if(window.Android&&window.Android.saveFile)return window.Android.saveFile(name,b64(u8),mime)?"saved":"fail";
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){}
  if(dl){try{await dl.save({filename:name,data:new Blob([u8])});return "saved"}catch(e){return e&&e.code==="declined"?"declined":"fail"}}
  // iPhone / iPad: open the share sheet so the file can go to Files, Telegram, mail…
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  if(ios&&navigator.canShare){try{const f=new File([u8],name,{type:mime});if(navigator.canShare({files:[f]})){await navigator.share({files:[f]});return "shared"}}catch(e){if(e&&e.name==="AbortError")return "declined"}}
  try{const url=URL.createObjectURL(new Blob([u8],{type:mime}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return "saved"}catch(e){return "fail"}
}
async function exportYear(){
  try{const r=await saveBytes(`Budget_${sel.year}.xlsx`,buildYearXlsx(sel.year),"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
    if(r!=="declined")toast(r==="saved"?t("exported"):r==="shared"?t("sharedOk"):t("noDl"))}catch(e){console.error(e);toast(t("noDl"))}
}
async function backup(){
  const u8=new TextEncoder().encode(JSON.stringify({app:"budget-tracker",v:2,meta,data}));
  const r=await saveBytes(`Budget_backup_${todayISO()}.json`,u8,"application/json");if(r!=="declined")toast(r==="saved"?t("backupDone"):r==="shared"?t("sharedOk"):t("noDl"));
}
function restore(file){
  const fr=new FileReader();
  fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o||!o.meta||!o.data)throw 0;
      const n=normalize(o.meta,o.data);meta=n.meta;data=n.data;cacheWrite();
      if(mode==="db"){saveMeta();for(const k of Object.keys(data))saveMonth(k)}
      sel.year=meta.years.slice().sort((a,b)=>b-a)[0];const sm=cfg(sel.year).startMonth;
      sel.month=(sel.year===CY&&now.getMonth()>=sm)?now.getMonth():sm;tab="month";applyReminder(false);render();toast(t("restored"))}
    catch(e){toast(t("badFile"))}};
  fr.readAsText(file);
}

/* ================= events ================= */
let toastT;function toast(msg){const el=$("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),2400)}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b)return;
  const ds=b.dataset;
  if(ds.year){sel.year=Number(ds.year);fixSel();render();return}
  if(ds.month){sel.month=Number(ds.month);render();return}
  if(ds.tab){tab=ds.tab;render();window.scrollTo(0,0);return}
  if(ds.edit){openEntry(ds.edit);return}
  if(ds.field){openField(ds.field);return}
  if(ds.delpart){delPart(ds.delpart);return}
  if(ds.cat&&draft){readDraft();draft.cat=ds.cat;drawEntry();return}
  if(ds.sug!==undefined&&draft){readDraft();draft.what=ds.sug;drawEntry();setTimeout(()=>{const a=$("amtIn");if(a)a.focus()},30);return}
  if(ds.lang){meta.lang=ds.lang;saveMeta();applyReminder(false);render();return}
  if(ds.cur){meta.cur=ds.cur;saveMeta();render();return}
  if(ds.sm){cfg(sel.year).startMonth=Number(ds.sm);if(sel.month<Number(ds.sm))sel.month=Number(ds.sm);saveMeta();render();return}
  if(b.id==="fab"){openEntry(null);return}
  switch(ds.act){
    case "newyear":openNewYear();break;
    case "createYear":createYear();break;
    case "saveEntry":saveEntry();break;
    case "delEntry":deleteEntry();break;
    case "neg":readDraft();draft.neg=!draft.neg;drawEntry();break;
    case "plus":{const v=parseNum($("plusIn").value);if(!(v>0)){$("plusIn").focus();break}readDraft();draft.amount=r2((Number(draft.amount)||0)+v);drawEntry();toast(t("added")+": "+fmt(draft.amount));break}
    case "addPart":addPart();break;
    case "addToday":window.__openAdd();break;
    case "remAllow":try{window.Android.askNotifPermission()}catch(e){}break;
    case "remTest":{const st=applyReminder(false);if(st==="no_permission"){try{window.Android.askNotifPermission()}catch(e){}}else{try{window.Android.testReminder();toast(t("remTestSent"))}catch(e){}}break}
    case "remCal":addToCalendar();break;
    case "close":closeSheet();break;
    case "export":exportYear();break;
    case "backup":backup();break;
    case "restore":$("restoreIn").click();break;
  }
});
$("scrim").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeSheet();
  if(e.key==="Enter"&&e.target.tagName==="INPUT"){if(draft){e.preventDefault();saveEntry()}else if(fieldEdit&&e.target.id==="fldIn"){e.preventDefault();addPart()}}
});
document.addEventListener("change",e=>{
  if(e.target.id==="restoreIn"&&e.target.files[0]){restore(e.target.files[0]);e.target.value="";return}
  if(e.target.id==="remOn"||e.target.id==="remTime"||e.target.id==="remSkip"){
    const r=meta.reminder;
    if(e.target.id==="remOn")r.on=e.target.checked;
    if(e.target.id==="remTime"&&/^\d{2}:\d{2}/.test(e.target.value))r.time=e.target.value.slice(0,5);
    if(e.target.id==="remSkip")r.skip=e.target.checked;
    saveMeta();const st=applyReminder(true);
    if(e.target.id!=="remSkip")toast(r.on?(st==="no_permission"?t("remAskToast"):t("remOnToast").replace("{t}",r.time)):t("remOffToast"));
    render();return;
  }
  if(e.target.id==="startIn"){const v=parseNum(e.target.value);cfg(sel.year).startSav=v===""?0:r2(v);saveMeta();e.target.value=v?fmt(v):"";toast(t("saved"))}
});
window.__back=function(){if($("sheet").classList.contains("open")){closeSheet();return true}if(tab!=="month"){tab="month";render();return true}return false};

/* ================= boot ================= */
if(!cacheRead()){meta.cfg[CY]={startMonth:now.getMonth(),startSav:0}}
fixSel();
render();
if(HAS_NATIVE&&meta.reminder.on)applyReminder(false);
// coming back to the app later in the day: refresh so the banner and "today" are current
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!$("sheet").classList.contains("open"))render()});
connect();
})();
</script>

<script>if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(function(){});</script>
